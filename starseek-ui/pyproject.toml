[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starseek-ui"
version = "0.3.0"
description = "Web dashboard for StarSeek (Jinja2 server-rendered)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "starseek-core>=0.3.0",
    "starseek-charts>=0.3.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["starseek_ui*"]
