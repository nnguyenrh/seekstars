[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starseek-core"
version = "0.3.0"
description = "Astrological birth chart engine, CLI, and API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyswisseph==2.10.3.2",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "respx>=0.20",
]

[project.scripts]
starseek = "starseek.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["starseek*"]
