[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starseek-workspace"
version = "0.3.0"
description = "StarSeek monorepo - install all packages for development"
requires-python = ">=3.11,<3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "respx>=0.20",
]
